name: model1_eval
description: Model 1 evaluation on DialogSum test - every system, same inference rule.
seed: 0
top_k: 3
use_stemmer: true          # same ROUGE settings as the oracle
reference_teacher: qwen7b  # PLAN: retention, agreement and tag F1 against the 7B teacher
teachers: [qwen7b, qwen1_5b]
teacher_params: {qwen7b: 7B, qwen1_5b: 1.5B}
students:                  # name -> checkpoint dir (latency and size use seed 0)
  model1_student_A: checkpoints/model1_student_A
  model1_student_B: checkpoints/model1_student_B
  model1_student_C: checkpoints/model1_student_C
  model1_student_D_noMLM: checkpoints/model1_student_D
  model1_student_E: checkpoints/model1_student_E
bertscore:
  enabled: true            # needs `uv sync --extra eval` (pulls PyTorch; evaluation only)
  model_type: roberta-large  # not in PLAN: bert_score's default for English
  batch_size: 32
latency_dialogues: 100     # not in PLAN: test dialogues timed for CPU latency
paths:
  raw_dir: data/raw
  labels_dir: data/labels
  processed_dir: data/processed/model1
  results_dir: results
