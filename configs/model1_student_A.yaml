name: model1_student_A
description: Student A, distilled from the Qwen2.5-14B teacher (v2 labels, scores + tags), MLM init.
seeds: [0, 1, 2]
max_hours: 10              # not in PLAN
paths:
  raw_dir: data/raw
  tokenizer_dir: data/tokenizer
  processed_dir: data/processed/model1
  labels_dir: data/labels/qwen14b
  init_checkpoint: checkpoints/mlm/encoder.keras
  output_dir: checkpoints/model1_student_A
  results_dir: results
data:
  max_utterances: 80       # not in PLAN: utterance slots per dialogue (DialogSum max is 65)
  max_dialogues: null      # cap per split (smoke runs only)
targets:
  source: qwen14b
  use_tags: true
init: mlm                  # mlm | random
model:
  vocab_size: 16000
  d_model: 384
  num_layers: 6
  num_heads: 6
  ffn_dim: 1536
  max_len: 512
  num_speakers: 8
  dropout: 0.1
  init_std: 0.02
  num_tags: 4
loss:
  listwise_lambda: 1.0
  temperature: 2.0
  tag_weight: 0.5
  score_scale: 10          # not in PLAN: sharpness of the listwise targets in [0, 1] (see losses.py)
  tag_class_weights: inverse_sqrt  # v2: decision / action_item are rare (null = uniform)
optimizer:
  name: adamw
  lr_encoder: 1.0e-4
  lr_heads: 1.0e-3
  warmup_fraction: 0.1
  schedule: cosine         # not in PLAN for students: same as other runs
  weight_decay: 0.01       # not in PLAN for students: same as other runs
training:
  batch_size: 16           # dialogues
  epochs: 10
  max_steps: null
  mixed_precision: mixed_float16
  buckets: [128, 256, 384, 512]  # not in PLAN, throughput only: batches of similar-length
  pool_batches: 50               # dialogues (shuffled pools of 50 batches), cut to a bucket
  early_stopping:          # v2: val_loss (v1 val_spearman kept training while val_loss rose)
    monitor: val_loss
    mode: min
    patience: 2            # not in PLAN
inference:
  top_k: 3
