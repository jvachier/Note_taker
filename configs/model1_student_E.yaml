base: model1_student_A.yaml
name: model1_student_E
description: >-
  Student E, importance from oracle 0/1 labels (like C) and tags from the Qwen2.5-7B teacher
  (like A), MLM init. Not in the original PLAN: added because A reproduces the teacher's
  late/long-utterance bias (see results/report).
paths:
  labels_dir: data/labels/oracle          # importance targets
  tag_labels_dir: data/labels/qwen7b      # tag targets
  output_dir: checkpoints/model1_student_E
targets:
  source: oracle
  use_tags: true
