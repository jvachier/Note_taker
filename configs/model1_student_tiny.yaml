base: model1_student_A.yaml
name: model1_student_tiny
description: CPU smoke test for student training (must finish in < 2 minutes).
seeds: [0]
max_hours: 0.03
paths:
  processed_dir: data/processed/model1_tiny
  labels_dir: data/labels/oracle   # teacher labels exist only on Kaggle; oracle runs locally
  init_checkpoint: null
  output_dir: checkpoints/model1_student_tiny
  results_dir: data/results_tiny
targets:
  source: oracle
  use_tags: false
data:
  max_dialogues: 200
init: random
model:
  d_model: 32
  num_layers: 1
  num_heads: 2
  ffn_dim: 64
  max_len: 64
training:
  batch_size: 2
  epochs: 1
  max_steps: 50
  mixed_precision: float32
