name: model2_cleanup
description: Punctuation and casing restoration on noisy lowercase text (~7M params).
seeds: [0, 1, 2]
max_hours: 10              # not in PLAN: fits one Kaggle session
paths:
  tokenizer_dir: data/tokenizer
  processed_dir: data/processed/model2
  output_dir: checkpoints/model2
data:
  window_words: 64
  max_len: 128
  dialogsum_oversample: 5
  noise:
    substitution: 0.05
    deletion: 0.03
    insertion: 0.02
    substitution_vocab_size: 20000
  punctuation_map: {",": comma, ":": comma, ".": period, "!": period, ";": period, "?": question}
  casing_classes: [lower, capitalised, upper]
  punct_classes: [none, comma, period, question]
model:
  vocab_size: 16000
  d_model: 256
  num_layers: 4
  num_heads: 4
  ffn_dim: 1024
  max_len: 128
  dropout: 0.1
  init_std: 0.02
loss:
  punct_class_weighting: inverse_sqrt_freq
  casing_weight: 1.0
  punct_weight: 1.0
optimizer:
  name: adamw
  peak_lr: 5.0e-4
  warmup_steps: 2000
  schedule: cosine
  weight_decay: 0.01
training:
  batch_size: 128
  epochs: 20               # not in PLAN: upper bound, early stopping decides
  max_steps: null
  mixed_precision: mixed_float16
  early_stopping:
    monitor: val_punct_macro_f1
    mode: max
    patience: 3            # not in PLAN
eval:
  noise_levels: [0.0, 0.05, 0.10, 0.20]
  test_sets: [wikitext_test, dialogsum_test]
