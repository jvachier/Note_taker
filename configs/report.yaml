name: report
description: Interactive results report for both models, from the saved results (not in PLAN).
seed: 0
output: results/report/index.html
model2:
  exp: model2_cleanup
  per_class_noise: 0.0       # noise level of the per-class F1 figure
model1:
  eval_config: configs/model1_eval.yaml   # systems, reference teacher, top_k and paths
  mlm_dir: results/model1_mlm
  main_student: model1_student_A          # the student we ship (7B teacher, MLM init)
  ablation: {with_mlm: model1_student_A, without_mlm: model1_student_D_noMLM}
  example_dialogue: test_0   # dialogue shown in the per-utterance score heatmap
  position_bins: 5           # bins of relative position in the dialogue
  position_systems: [Lead-3, Oracle, Teacher qwen7b, model1_student_A, model1_student_C]
verdicts:                    # thresholds behind the good / mixed / poor badges
  retention_target: 0.90     # PLAN 5.6
  good_f1: 0.75              # class F1 at or above: strong
  poor_f1: 0.50              # class F1 below: weak
  min_support: 50            # classes with fewer test examples are not judged
  good_spearman: 0.60        # agreement with the teacher at or above: good
  poor_spearman: 0.30        # below: poor
  noise_drop_ok: 0.20        # relative macro-F1 loss from clean to the highest noise level
  plateau_epochs: 3          # last epochs checked for convergence
  plateau_gain: 0.005        # validation metric gain over those epochs counted as converged
  unstable_drop: 0.05        # best-to-last validation drop flagged as unstable training
