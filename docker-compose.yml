# Demo app for both models: `docker compose up --build`, then open http://localhost:8050
#
# Settings come from your shell environment or a `.env` file next to this one (git-ignored):
# - HF_NAMESPACE: the Hugging Face user or organisation hosting the models; they are then
#   downloaded from <HF_NAMESPACE>/punctuation-casing-en-7m and <HF_NAMESPACE>/meeting-notes-en-21m
#   (cached in a volume);
# - or MODEL2_SOURCE / MODEL1_SOURCE: a Hub repo ID each, or a local package mounted from
#   ./release (`uv run python -m src.publish.package`), e.g. /models/meeting-notes-en-21m.
services:
  app:
    build: .
    image: dialogue-notes-demo:latest
    ports:
      - "${PORT:-8050}:8050"
    environment:
      HF_NAMESPACE: ${HF_NAMESPACE:-}
      MODEL2_SOURCE: ${MODEL2_SOURCE:-}
      MODEL1_SOURCE: ${MODEL1_SOURCE:-}
      MODEL_REVISION: ${MODEL_REVISION:-}   # Hub branch, tag or commit; empty = main
      HF_TOKEN: ${HF_TOKEN:-}               # only needed for private repos
    volumes:
      - hf-cache:/cache/huggingface
      - ./release:/models:ro
    restart: unless-stopped

volumes:
  hf-cache:
