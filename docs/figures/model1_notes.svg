<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1272" viewBox="0 0 900 1272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Model 1 · Meeting notes (meeting-notes-en-21m)</title>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b6a65'/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="1271" rx="16" fill="#ffffff" stroke="#e1e0d9"/>
<text x="32" y="42" font-size="21" fill="#1f1f1d" font-weight="700" text-anchor="start">Model 1 · Meeting notes (meeting-notes-en-21m)</text>
<text x="32" y="66" font-size="13.5" fill="#6b6a65" font-weight="400" text-anchor="start">A hierarchical transformer: each sentence is encoded on its own, then the sentences read each other.</text>
<rect x="70" y="100" width="470" height="88" rx="10" fill="#f5f5f2" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="305.0" y="121.25" font-size="14.5" fill="#1f1f1d" font-weight="700" text-anchor="middle">Input: the meeting, one sentence per row</text>
<text x="305.0" y="141.75" font-size="12.0" fill="#52514e" font-weight="400" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Anna: Then let's launch on the 15th.</text>
<text x="305.0" y="159.75" font-size="12.0" fill="#52514e" font-weight="400" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Ben:  Okay, I'll send an update…</text>
<text x="305.0" y="177.75" font-size="12.0" fill="#52514e" font-weight="400" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">…</text>
<text x="576" y="130" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">speakers numbered 1–8;</text>
<text x="576" y="148" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">≤ 256 sentences per window,</text>
<text x="576" y="166" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">windows overlap by 64</text>
<path d="M305.0,190 L305.0,218" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="220" width="470" height="58" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="305.0" y="244.25" font-size="14.5" fill="#1b4f8f" font-weight="700" text-anchor="middle">WordPiece tokenizer, per sentence</text>
<text x="305.0" y="264.75" font-size="12.0" fill="#2f4a6b" font-weight="400" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">[CLS] then let ' s launch … [SEP]</text>
<text x="576" y="244" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">same 16,000-token vocabulary</text>
<text x="576" y="262" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">≤ 64 tokens per sentence</text>
<path d="M305.0,280 L305.0,308" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="310" width="470" height="50" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="305.0" y="339.25" font-size="14.5" fill="#1b4f8f" font-weight="700" text-anchor="middle">Token + position + speaker embeddings</text>
<text x="576" y="339" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">d_model 384</text>
<path d="M305.0,362 L305.0,390" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="392" width="470" height="318" rx="12" fill="#f3f8fe" stroke="#2a78d6" stroke-width="1.5"/>
<text x="86" y="418" font-size="14.5" fill="#1b4f8f" font-weight="700" text-anchor="start">① Sentence encoder: 6 × pre-LN block</text>
<path d="M290.0,428 L290.0,438" stroke="#6b6a65" stroke-width="1.6"/>
<rect x="130" y="440" width="320" height="30" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="457.5" font-size="12.5" fill="#2f4a6b" font-weight="400" text-anchor="middle">LayerNorm</text>
<path d="M290.0,471 L290.0,487" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="130" y="489" width="320" height="42" rx="10" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="505.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Multi-head self-attention</text>
<text x="290.0" y="524.0" font-size="11.5" fill="#e6f0fc" font-weight="400" text-anchor="middle">6 heads</text>
<path d="M290.0,532 L290.0,543" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="290.0" cy="553" r="9" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="558" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="middle">+</text>
<path d="M290.0,434 L484,434 L484,553 L301.0,553" fill="none" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M290.0,563 L290.0,579" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="130" y="581" width="320" height="30" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="598.5" font-size="12.5" fill="#2f4a6b" font-weight="400" text-anchor="middle">LayerNorm</text>
<path d="M290.0,612 L290.0,628" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="130" y="630" width="320" height="42" rx="10" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="646.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Feed-forward network</text>
<text x="290.0" y="665.0" font-size="11.5" fill="#e6f0fc" font-weight="400" text-anchor="middle">1536 units, GELU</text>
<path d="M290.0,673 L290.0,684" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="290.0" cy="694" r="9" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="699" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="middle">+</text>
<path d="M290.0,573 L484,573 L484,694 L301.0,694" fill="none" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M290.0,703 L290.0,710" stroke="#6b6a65" stroke-width="1.6"/>
<text x="576" y="501.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">the same weights read every</text>
<text x="576" y="519.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">sentence separately</text>
<text x="576" y="537.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start"></text>
<text x="576" y="555.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">17.0M params, pretrained</text>
<text x="576" y="573.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">by masked-language</text>
<text x="576" y="591.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">modelling on WikiText-103</text>
<text x="576" y="609.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">and DialogSum</text>
<path d="M305.0,712 L305.0,750" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="315.0" y="720" width="62" height="20" rx="4" fill="#2a78d6"/>
<text x="346.0" y="734" font-size="11.5" fill="#ffffff" font-weight="700" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">[CLS]</text>
<text x="576" y="735" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">one vector per sentence</text>
<rect x="70" y="752" width="470" height="44" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="305.0" y="767.5" font-size="12.5" fill="#2f4a6b" font-weight="400" text-anchor="middle">+ sentence-position, speaker</text>
<text x="305.0" y="785.5" font-size="12.5" fill="#2f4a6b" font-weight="400" text-anchor="middle">and speaker-change embeddings</text>
<path d="M305.0,798 L305.0,826" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="828" width="470" height="70" rx="10" fill="#17508f" stroke="#17508f" stroke-width="1.5"/>
<text x="305.0" y="858.5" font-size="14.5" fill="#ffffff" font-weight="700" text-anchor="middle">② Meeting encoder: 2 × pre-LN block</text>
<text x="305.0" y="879.0" font-size="12" fill="#dce8f7" font-weight="400" text-anchor="middle">the same block as ①, over the sentence vectors</text>
<text x="576" y="831" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">every sentence attends to</text>
<text x="576" y="849" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">every other sentence</text>
<text x="576" y="867" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start"></text>
<text x="576" y="885" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">≈ 4M new params, trained on</text>
<text x="576" y="903" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">the gold-labelled corpus</text>
<path d="M305.0,900 L305.0,928" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="930" width="470" height="40" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="305.0" y="952.75" font-size="13" fill="#2f4a6b" font-weight="400" text-anchor="middle">Final LayerNorm</text>
<rect x="70.0" y="1002" width="148.66666666666666" height="66" rx="10" fill="#fff3e3" stroke="#e08a1e" stroke-width="1.5"/>
<text x="144.33333333333331" y="1021.25" font-size="13.5" fill="#8a4b00" font-weight="700" text-anchor="middle">Spans</text>
<text x="144.33333333333331" y="1040.75" font-size="12" fill="#6b4a1f" font-weight="400" text-anchor="middle">Dense(5) per token</text>
<text x="144.33333333333331" y="1058.25" font-size="12" fill="#6b4a1f" font-weight="400" text-anchor="middle">owner · deadline</text>
<path d="M305.0,972 L305.0,1000" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="230.66666666666666" y="1002" width="148.66666666666666" height="66" rx="10" fill="#fff3e3" stroke="#e08a1e" stroke-width="1.5"/>
<text x="305.0" y="1021.25" font-size="13.5" fill="#8a4b00" font-weight="700" text-anchor="middle">Importance</text>
<text x="305.0" y="1040.75" font-size="12" fill="#6b4a1f" font-weight="400" text-anchor="middle">Dense(1) · sigmoid</text>
<text x="305.0" y="1058.25" font-size="12" fill="#6b4a1f" font-weight="400" text-anchor="middle">kept if ≥ 0.40</text>
<path d="M465.66666666666663,972 L465.66666666666663,1000" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="391.3333333333333" y="1002" width="148.66666666666666" height="66" rx="10" fill="#fff3e3" stroke="#e08a1e" stroke-width="1.5"/>
<text x="465.66666666666663" y="1021.25" font-size="13.5" fill="#8a4b00" font-weight="700" text-anchor="middle">Zone</text>
<text x="465.66666666666663" y="1040.75" font-size="12" fill="#6b4a1f" font-weight="400" text-anchor="middle">Dense(5) · softmax</text>
<text x="465.66666666666663" y="1058.25" font-size="12" fill="#6b4a1f" font-weight="400" text-anchor="middle">one of 5 zones</text>
<path d="M70,670 L36,670 L36,1035 L68,1035" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<text transform="rotate(-90 30 730)" x="30" y="730" font-size="11.5" fill="#6b6a65" font-weight="400" text-anchor="middle" font-style="italic">every token's state</text>
<path d="M540,950 L726.0,950 L726.0,1000" fill="none" stroke="#8c8b85" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="576" y="1002" width="300" height="66" rx="10" fill="#fafaf8" stroke="#b5b4ad" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="726.0" y="1021.75" font-size="13.5" fill="#8c8b85" font-weight="700" text-anchor="middle">Reason · depends_on</text>
<text x="726.0" y="1041.25" font-size="11.5" fill="#8c8b85" font-weight="400" text-anchor="middle">teacher targets, trained only in</text>
<text x="726.0" y="1058.25" font-size="11.5" fill="#8c8b85" font-weight="400" text-anchor="middle">run E4; unused in the release</text>
<path d="M144.33333333333331,1070 L245.0,1098" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M305.0,1070 L305.0,1098" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M465.66666666666663,1070 L365.0,1098" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="1098" width="470" height="70" rx="10" fill="#e9f6ee" stroke="#2e9b57" stroke-width="1.5"/>
<text x="305.0" y="1128.25" font-size="14.5" fill="#1c6b3a" font-weight="700" text-anchor="middle">Output: per sentence</text>
<text x="305.0" y="1148.75" font-size="12.5" fill="#2d5a3d" font-weight="400" text-anchor="middle">kept or not · zone · owner · deadline</text>
<text x="576" y="1088" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">zones: context, discussion,</text>
<text x="576" y="1106" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">decision, action item, closing</text>
<text x="576" y="1124" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start"></text>
<text x="576" y="1142" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">selection rules then build</text>
<text x="576" y="1160" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">Decisions, Action items</text>
<text x="576" y="1178" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">and Key points</text>
<rect x="70" y="1187" width="16" height="14" rx="3" fill="#f5f5f2" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="92" y="1198" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">input</text>
<rect x="133.0" y="1187" width="16" height="14" rx="3" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="155.0" y="1198" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">embeddings / norm</text>
<rect x="275.2" y="1187" width="16" height="14" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="297.2" y="1198" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">transformer</text>
<rect x="377.79999999999995" y="1187" width="16" height="14" rx="3" fill="#17508f" stroke="#17508f" stroke-width="1.5"/>
<text x="399.79999999999995" y="1198" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">meeting encoder</text>
<rect x="506.79999999999995" y="1187" width="16" height="14" rx="3" fill="#fff3e3" stroke="#e08a1e" stroke-width="1.5"/>
<text x="528.8" y="1198" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">output head</text>
<rect x="70" y="1209" width="16" height="14" rx="3" fill="#fafaf8" stroke="#b5b4ad" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="92" y="1220" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">not used by the release</text>
<rect x="251.79999999999998" y="1209" width="16" height="14" rx="3" fill="#e9f6ee" stroke="#2e9b57" stroke-width="1.5"/>
<text x="273.79999999999995" y="1220" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">output</text>
<text x="70" y="1248" font-size="12.5" fill="#6b6a65" font-weight="400" text-anchor="start">20.9M parameters · 84 MB · ~0.4 s per 100-sentence meeting on an Apple M2 CPU</text>
</svg>
