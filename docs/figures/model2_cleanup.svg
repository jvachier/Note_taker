<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Model 2 · Cleanup (punctuation-casing-en-7m)</title>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b6a65'/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="1039" rx="16" fill="#ffffff" stroke="#e1e0d9"/>
<text x="32" y="42" font-size="21" fill="#1f1f1d" font-weight="700" text-anchor="start">Model 2 · Cleanup (punctuation-casing-en-7m)</text>
<text x="32" y="66" font-size="13.5" fill="#6b6a65" font-weight="400" text-anchor="start">A token-classification transformer: one casing and one punctuation label per word.</text>
<rect x="70" y="100" width="470" height="70" rx="10" fill="#f5f5f2" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="305.0" y="130.25" font-size="14.5" fill="#1f1f1d" font-weight="700" text-anchor="middle">Input: lowercase words, no punctuation</text>
<text x="305.0" y="150.75" font-size="12.0" fill="#52514e" font-weight="400" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">okay so lets start with the budget</text>
<text x="576" y="130" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">windows of ≤ 64 words,</text>
<text x="576" y="148" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">stride 32 for long texts</text>
<path d="M305.0,172 L305.0,200" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="202" width="470" height="58" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="305.0" y="226.25" font-size="14.5" fill="#1b4f8f" font-weight="700" text-anchor="middle">WordPiece tokenizer (trained here)</text>
<text x="305.0" y="246.75" font-size="12.0" fill="#2f4a6b" font-weight="400" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">[CLS] okay so let ##s start … [SEP]</text>
<text x="576" y="226" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">16,000 tokens, uncased</text>
<text x="576" y="244" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">≤ 128 tokens per window</text>
<path d="M305.0,262 L305.0,290" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="292" width="470" height="50" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="305.0" y="321.25" font-size="14.5" fill="#1b4f8f" font-weight="700" text-anchor="middle">Token + learned position embeddings</text>
<text x="576" y="321" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">d_model 256</text>
<path d="M305.0,344 L305.0,372" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="374" width="470" height="318" rx="12" fill="#f3f8fe" stroke="#2a78d6" stroke-width="1.5"/>
<text x="86" y="400" font-size="14.5" fill="#1b4f8f" font-weight="700" text-anchor="start">4 × pre-LayerNorm transformer block</text>
<path d="M290.0,410 L290.0,420" stroke="#6b6a65" stroke-width="1.6"/>
<rect x="130" y="422" width="320" height="30" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="439.5" font-size="12.5" fill="#2f4a6b" font-weight="400" text-anchor="middle">LayerNorm</text>
<path d="M290.0,453 L290.0,469" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="130" y="471" width="320" height="42" rx="10" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="487.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Multi-head self-attention</text>
<text x="290.0" y="506.0" font-size="11.5" fill="#e6f0fc" font-weight="400" text-anchor="middle">4 heads</text>
<path d="M290.0,514 L290.0,525" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="290.0" cy="535" r="9" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="540" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="middle">+</text>
<path d="M290.0,416 L484,416 L484,535 L301.0,535" fill="none" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M290.0,545 L290.0,561" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="130" y="563" width="320" height="30" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="580.5" font-size="12.5" fill="#2f4a6b" font-weight="400" text-anchor="middle">LayerNorm</text>
<path d="M290.0,594 L290.0,610" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="130" y="612" width="320" height="42" rx="10" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="628.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Feed-forward network</text>
<text x="290.0" y="647.0" font-size="11.5" fill="#e6f0fc" font-weight="400" text-anchor="middle">1024 units, GELU</text>
<path d="M290.0,655 L290.0,666" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<circle cx="290.0" cy="676" r="9" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="290.0" y="681" font-size="15" fill="#2a78d6" font-weight="700" text-anchor="middle">+</text>
<path d="M290.0,555 L484,555 L484,676 L301.0,676" fill="none" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<path d="M290.0,685 L290.0,692" stroke="#6b6a65" stroke-width="1.6"/>
<text x="576" y="492.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">the whole window at once:</text>
<text x="576" y="510.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">every token attends to</text>
<text x="576" y="528.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">every other token</text>
<text x="576" y="546.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start"></text>
<text x="576" y="564.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">residual connections</text>
<text x="576" y="582.0" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">(dashed), dropout 0.1</text>
<path d="M305.0,694 L305.0,722" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="724" width="470" height="40" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="305.0" y="746.75" font-size="13" fill="#2f4a6b" font-weight="400" text-anchor="middle">Final LayerNorm</text>
<path d="M182.5,766 L182.5,794" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="796" width="225.0" height="62" rx="10" fill="#fff3e3" stroke="#e08a1e" stroke-width="1.5"/>
<text x="182.5" y="821.75" font-size="13.5" fill="#8a4b00" font-weight="700" text-anchor="middle">Casing · Dense(3)</text>
<text x="182.5" y="841.25" font-size="12.5" fill="#6b4a1f" font-weight="400" text-anchor="middle">lower · Capitalised · UPPER</text>
<path d="M427.5,766 L427.5,794" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="315.0" y="796" width="225.0" height="62" rx="10" fill="#fff3e3" stroke="#e08a1e" stroke-width="1.5"/>
<text x="427.5" y="821.75" font-size="13.5" fill="#8a4b00" font-weight="700" text-anchor="middle">Punctuation · Dense(4)</text>
<text x="427.5" y="841.25" font-size="12.5" fill="#6b4a1f" font-weight="400" text-anchor="middle">none · ,  · .  · ?</text>
<text x="576" y="813" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">one label per token;</text>
<text x="576" y="831" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">read at each word's</text>
<text x="576" y="849" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">first subword</text>
<path d="M182.5,860 L265.0,888" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M427.5,860 L345.0,888" fill="none" stroke="#6b6a65" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="890" width="470" height="70" rx="10" fill="#e9f6ee" stroke="#2e9b57" stroke-width="1.5"/>
<text x="305.0" y="920.25" font-size="14.5" fill="#1c6b3a" font-weight="700" text-anchor="middle">Output: one word in, one word out</text>
<text x="305.0" y="940.75" font-size="12.0" fill="#2d5a3d" font-weight="400" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Okay, so lets start with the budget.</text>
<text x="576" y="920" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">never adds, removes</text>
<text x="576" y="938" font-size="12.5" fill="#52514e" font-weight="400" text-anchor="start">or corrects words</text>
<rect x="70" y="979" width="16" height="14" rx="3" fill="#f5f5f2" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="92" y="990" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">input</text>
<rect x="133.0" y="979" width="16" height="14" rx="3" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="155.0" y="990" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">embeddings / norm</text>
<rect x="275.2" y="979" width="16" height="14" rx="3" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/>
<text x="297.2" y="990" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">transformer</text>
<rect x="377.79999999999995" y="979" width="16" height="14" rx="3" fill="#fff3e3" stroke="#e08a1e" stroke-width="1.5"/>
<text x="399.79999999999995" y="990" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">output head</text>
<rect x="480.4" y="979" width="16" height="14" rx="3" fill="#e9f6ee" stroke="#2e9b57" stroke-width="1.5"/>
<text x="502.4" y="990" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">output</text>
<text x="70" y="1016" font-size="12.5" fill="#6b6a65" font-weight="400" text-anchor="start">7.3M parameters · 29 MB · ~5 ms per sentence on an Apple M2 CPU</text>
</svg>
