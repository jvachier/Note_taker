[project]
name = "dialogue-models"
version = "0.1.0"
description = "Two from-scratch Keras 3 (JAX) models: punctuation/casing cleanup and extractive meeting notes."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "keras>=3.6",
    "jax>=0.4.34",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "datasets>=3.0",
    "pyyaml>=6.0",
    "rouge-score>=0.1.2",
    "huggingface-hub>=0.25",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# Dash demo app (app/), also installed in the Docker image.
app = ["dash>=3.0", "gunicorn>=23.0"]
# Kaggle GPU runtime.
cuda = ["jax[cuda12]>=0.4.34"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "plotly>=5.24", "pre-commit>=3.8", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Raised inside keras/jax on NumPy 2, not by our code.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Self-contained Kaggle notebooks (notebook style; tested in tests/test_notebooks.py).
extend-exclude = ["notebooks/kaggle/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
