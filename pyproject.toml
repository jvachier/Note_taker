[project]
name = "dialogue-models"
version = "0.1.0"
description = "Two from-scratch Keras 3 (JAX) models: punctuation/casing cleanup and a distilled utterance scorer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "keras>=3.6",
    "jax>=0.4.34",
    "numpy>=1.26",
    "tokenizers>=0.20",
    "datasets>=3.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "rouge-score>=0.1.2",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# BERTScore pulls in PyTorch, so it stays out of the default (training) environment.
eval = ["bert-score>=0.3.13"]
# Kaggle GPU runtime.
cuda = ["jax[cuda12]>=0.4.34"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
